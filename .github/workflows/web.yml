name: Version téléphone (web app)

# Reconstruit app/m/ (FIRE LoL sur iPhone et Android) quand le code de l'application change :
# le moteur navigateur (fire-web.js, tiré de coach.js, jeux.js, worlds.js) et les bibliothèques (vendor/).
# L'interface elle-même est lue directement dans app/renderer/ : elle est toujours à jour.
on:
  push:
    branches: [main]
    paths: ['app/coach.js', 'app/jeux.js', 'app/worlds.js', 'app/vendor.js', 'app/package.json', 'app/renderer/v2/icons.json', 'app/*.json', 'web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bibliothèques (vendor)
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node vendor.js
          mkdir -p m/vendor && cp -r renderer/vendor/* m/vendor/
      - name: Moteur navigateur
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node build.mjs
      - name: Publier
        shell: bash
        run: |
          git config user.name "FIRE web"
          git config user.email "actions@users.noreply.github.com"
          git add app/m
          if git diff --cached --quiet; then echo "rien de neuf"; exit 0; fi
          git commit -m "Version téléphone : reconstruite"
          git pull --rebase origin main
          git push origin HEAD:main
