name: Apps du FIRE Launcher (Kiting, Listen)
# Branche « apps » : les versions d'origine de FIRE-Kiting.exe et FIRE-Listen.exe.
# À chaque envoi, on relance la compilation sur main (apps-build.yml) : elle ajoute le menu admin,
# publie les .exe dans la release « apps » et met à jour le launcher.
on:
  push:
    branches: [apps]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Compilation avec le menu admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apps-build.yml --ref main -R "${{ github.repository }}"
