name: Compiler FIRE LoL (Windows)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Vérifier les fichiers de mise à jour automatique
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml
          test -f dist/FIRE-LoL-Setup.exe.blockmap
          cat dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: FIRE-LoL-Windows
          path: |
            app/dist/*.exe
            app/dist/latest.yml
      - id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: FIRE LoL v${{ steps.version.outputs.v }}
          make_latest: true
          files: |
            app/dist/FIRE-LoL-Setup.exe
            app/dist/FIRE-LoL-Setup.exe.blockmap
            app/dist/latest.yml
            app/dist/FIRE-LoL-Portable.exe
