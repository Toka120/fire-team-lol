name: Compiler FIRE LoL (Windows)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Vérifier les fichiers de mise à jour automatique
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml
          test -f dist/FIRE-LoL-Setup.exe.blockmap
          cat dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: FIRE-LoL-Windows
          path: |
            app/dist/*.exe
            app/dist/latest.yml
      - id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: FIRE LoL v${{ steps.version.outputs.v }}
          make_latest: true
          files: |
            app/dist/FIRE-LoL-Setup.exe
            app/dist/FIRE-LoL-Setup.exe.blockmap
            app/dist/latest.yml
            app/dist/FIRE-LoL-Portable.exe
      # Paquet pour le Microsoft Store (le Store le signe et gère les mises à jour).
      # Les 3 valeurs viennent de Partner Center › Identité du produit, enregistrées dans
      # Settings › Secrets and variables › Actions › Variables du dépôt.
      # Le salon vocal utilise le micro : le paquet Store doit le déclarer (electron-builder n'a pas d'option pour ça).
      - name: Micro dans le manifeste Store
        continue-on-error: true
        shell: bash
        run: >
          node -e "const fs=require('fs');const f='node_modules/app-builder-lib/templates/appx/appxmanifest.xml';let s=fs.readFileSync(f,'utf8');
          if(!s.includes('DeviceCapability Name=\"microphone\"')){s=s.replace('<rescap:Capability Name=\"runFullTrust\"/>','<rescap:Capability Name=\"runFullTrust\"/>\n    <DeviceCapability Name=\"microphone\"/>');fs.writeFileSync(f,s);}
          console.log(s.includes('microphone')?'micro declare':'ECHEC')"
      - name: Paquet Microsoft Store
        continue-on-error: true
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >
          npx electron-builder --win appx --publish never
          -c.appx.identityName="${{ vars.STORE_IDENTITY_NAME || 'Toks42o.FIRELoL' }}"
          -c.appx.publisher="${{ vars.STORE_PUBLISHER || 'CN=B8EFAA3A-8B5A-4888-81D9-772E2A6DFB2C' }}"
          -c.appx.publisherDisplayName="${{ vars.STORE_PUBLISHER_NAME || 'Toks42o' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: FIRE-LoL-Store
          path: app/dist/*.appx
          if-no-files-found: warn
