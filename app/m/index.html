<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FIRE LoL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>FIRE LoL</title>
<style>
  html, body { margin: 0; background: #0d0f14; color: #eee; font-family: system-ui, sans-serif; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #boot img { width: 96px; height: 96px; border-radius: 22px; animation: bootPulse 1.6s ease-in-out infinite; box-shadow: 0 10px 40px rgb(255 120 40 / 25%); }
  #boot p { opacity: .7; font-size: 14px; }
  @keyframes bootPulse { 50% { transform: scale(1.06); box-shadow: 0 10px 50px rgb(255 120 40 / 45%); } }
</style>
</head>
<body>
<div id="boot"><img src="icon-192.png" alt=""><p id="boot-t">Chargement de FIRE…</p></div>
<script>
// FIRE LoL sur téléphone : charge l'interface de l'application PC (dossier ../renderer, toujours à jour avec la dernière version)
// et remplace son « moteur » (Electron) par fire-web.js, qui fait la même chose dans le navigateur.
// Si quelque chose casse au lancement, on l'affiche (au lieu d'un écran vide) avec de quoi réparer.
window.__fireErrs = [];
window.addEventListener('error', (e) => { window.__fireErrs.push((e.message || 'erreur') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
window.addEventListener('unhandledrejection', (e) => { window.__fireErrs.push('promesse : ' + ((e.reason && e.reason.message) || e.reason)); });
async function fireRepair() {
  try { const rs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : []; for (const r of rs) await r.unregister(); } catch (e) { /* */ }
  try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) { /* */ }
  location.reload();
}
function fireStuck(msg) {
  if (document.getElementById('boot-err')) return;
  const d = document.createElement('div'); d.id = 'boot-err';
  d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0d0f14;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.45 system-ui,sans-serif';
  const errs = (window.__fireErrs || []).slice(-4).join('\n');
  d.innerHTML = '<img src="icon-192.png" style="width:72px;height:72px;border-radius:18px"><b style="font-size:18px">FIRE n’a pas réussi à se lancer</b><p style="opacity:.75;margin:0">' + msg + '</p>'
    + (errs ? '<pre style="white-space:pre-wrap;font-size:11.5px;opacity:.6;max-width:100%;margin:0">' + errs.replace(/</g, '&lt;') + '</pre>' : '')
    + '<button id="be-r" style="min-height:46px;padding:0 22px;border-radius:12px;border:0;background:#f5a623;color:#111;font-weight:700;font-size:15px">Réparer et relancer</button>'
    + '<button id="be-l" style="min-height:40px;padding:0 18px;border-radius:12px;border:1px solid #ffffff33;background:none;color:#eee;font-size:14px">Recharger</button>'
    + '<small style="opacity:.5">« Réparer » vide seulement les fichiers gardés en mémoire : ton code et tes réglages restent.</small>';
  document.body.append(d);
  d.querySelector('#be-r').onclick = fireRepair; d.querySelector('#be-l').onclick = () => location.reload();
}
// Au bout de 20 s, si ni l'écran du code ni l'app ne sont affichés, c'est que le lancement a cassé.
setTimeout(() => { const a = document.getElementById('app'), l = document.getElementById('lock'); if (!(a && !a.hidden) && !(l && !l.hidden)) fireStuck('Le lancement s’est bloqué. Vérifie ta connexion, puis touche « Réparer et relancer ».'); }, 20000);
(async () => {
  const R = new URL('../renderer/', location.href);
  const fail = (e) => { const t = document.getElementById('boot-t'); const m = 'FIRE n’a pas pu se charger (' + (e && e.message || e) + '). Vérifie ta connexion et recharge la page.'; if (t) t.textContent = m; else fireStuck(m); };
  // Version annoncée par l'équipe : ajoutée à chaque fichier pour que le téléphone charge toujours la dernière.
  let ver = '';
  const bt = document.getElementById('boot-t'); if (bt) bt.textContent = 'Recherche de mises à jour…';
  try { ver = localStorage.getItem('fire.web.lastVer') || ''; } catch (e) { /* */ }
  try {
    const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 5000);
    const j = await (await fetch(new URL('../../joueurs.json', location.href).href + '?t=' + Date.now(), { cache: 'no-store', signal: ac.signal })).json();
    clearTimeout(to);
    if (j && j.derniere_version) { ver = String(j.derniere_version); if (bt) bt.textContent = 'Chargement de FIRE v' + ver + '…'; try { localStorage.setItem('fire.web.lastVer', ver); } catch (e) { /* */ } }
  } catch (e) { /* hors ligne : dernière version connue */ }
  const V = (u) => (!u || /^(data:|blob:|#)/i.test(u) || !ver || new URL(u, location.href).origin !== location.origin) ? u : u + (u.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(ver);
  try {
    const html = await (await fetch(V(new URL('index.html', R).href), { cache: 'no-cache' })).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const fix = (u) => (!u || /^(https?:|data:|blob:|#)/i.test(u)) ? u : V(u.startsWith('vendor/') ? new URL(u, location.href).href : new URL(u, R).href);
    for (const el of doc.querySelectorAll('[src]')) el.setAttribute('src', fix(el.getAttribute('src')));
    for (const el of doc.querySelectorAll('link[href]')) el.setAttribute('href', fix(el.getAttribute('href')));
    const scripts = [...doc.querySelectorAll('script')].map((s) => s.getAttribute('src')).filter(Boolean);
    doc.querySelectorAll('script').forEach((s) => s.remove());
    for (const l of doc.querySelectorAll('link[rel=stylesheet]')) document.head.append(l);
    const mob = document.createElement('link'); mob.rel = 'stylesheet'; mob.href = V('mobile.css'); document.head.append(mob);
    document.documentElement.classList.add('mobile');
    document.body.innerHTML = doc.body.innerHTML;
    const load = (src) => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('script ' + src.split('/').pop())); document.body.append(s); });
    await load(V('fire-web.js'));
    for (const s of scripts) await load(s);
    await load(V('mobile.js'));
  } catch (e) { fail(e); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
