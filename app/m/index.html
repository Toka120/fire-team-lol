<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FIRE LoL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>FIRE LoL</title>
<style>
  html, body { margin: 0; background: #0d0f14; color: #eee; font-family: system-ui, sans-serif; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #boot img { width: 96px; height: 96px; border-radius: 22px; }
  #boot p { opacity: .7; font-size: 14px; }
</style>
</head>
<body>
<div id="boot"><img src="icon-192.png" alt=""><p id="boot-t">Chargement de FIRE…</p></div>
<script>
// FIRE LoL sur téléphone : charge l'interface de l'application PC (dossier ../renderer, toujours à jour avec la dernière version)
// et remplace son « moteur » (Electron) par fire-web.js, qui fait la même chose dans le navigateur.
(async () => {
  const R = new URL('../renderer/', location.href);
  const fail = (e) => { document.getElementById('boot-t').textContent = 'FIRE n’a pas pu se charger (' + (e && e.message || e) + '). Vérifie ta connexion et recharge la page.'; };
  try {
    const html = await (await fetch(new URL('index.html', R), { cache: 'no-cache' })).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const fix = (u) => (!u || /^(https?:|data:|blob:|#)/i.test(u)) ? u : u.startsWith('vendor/') ? new URL(u, location.href).href : new URL(u, R).href;
    for (const el of doc.querySelectorAll('[src]')) el.setAttribute('src', fix(el.getAttribute('src')));
    for (const el of doc.querySelectorAll('link[href]')) el.setAttribute('href', fix(el.getAttribute('href')));
    const scripts = [...doc.querySelectorAll('script')].map((s) => s.getAttribute('src')).filter(Boolean);
    doc.querySelectorAll('script').forEach((s) => s.remove());
    for (const l of doc.querySelectorAll('link[rel=stylesheet]')) document.head.append(l);
    const mob = document.createElement('link'); mob.rel = 'stylesheet'; mob.href = 'mobile.css'; document.head.append(mob);
    document.documentElement.classList.add('mobile');
    document.body.innerHTML = doc.body.innerHTML;
    const load = (src) => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('script ' + src.split('/').pop())); document.body.append(s); });
    await load('fire-web.js');
    for (const s of scripts) await load(s);
    await load('mobile.js');
  } catch (e) { fail(e); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
